<html lang="en" data-theme="dark">

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Epik</title>
    <!-- Two stylesheets rather than one with an @import: the vendored brand

         separate means neither build step has to understand the other. -->

    <link data-trunk rel="tailwind-css" href="styles/main.css" />
    <link data-trunk rel="rust" data-wasm-opt="z" />
  </head>
  <body></body>
</html>
