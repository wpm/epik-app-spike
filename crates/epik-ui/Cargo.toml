[package]
name = "epik-ui"
description = "Leptos frontend for the Epik desktop application."
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/wpm/epik-app-spike"

# Not a member of the root workspace: this crate targets wasm32, and
# `cargo build --workspace` would try to build it for the host. It is checked on
# its own target instead (`trunk build` and a wasm-target clippy run, both in
# CI). Versions are duplicated from the root [workspace.dependencies] rather than
# inherited for the same reason — in particular `serde`, which has to match the
# core it deserializes.
[dependencies]
epik-core = { path = "../epik-core", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Markdown for assistant output. Pure Rust, builds for wasm, and streaming-safe:
# it renders whatever prefix has arrived so far without needing a complete document.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

leptos = { version = "0.8", features = ["csr"] }
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "Window",
  "Document",
  "Element",
  "HtmlElement",
  "HtmlTextAreaElement",
  "HtmlInputElement",
] }
