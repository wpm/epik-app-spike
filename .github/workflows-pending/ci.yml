# Rust checks for every pull request.
#
# ---------------------------------------------------------------------------
# NOT YET ACTIVE. This file is parked outside `.github/workflows/` because the
# headless build that wrote it could not create it in place: GitHub refuses to
# let any Actions token add or edit a file under `.github/workflows/`, and
# `GITHUB_TOKEN` cannot be granted the `workflows` permission that would allow
# it — the `permissions:` key has no such setting. Only a personal access token
# with "Workflows: write" can commit a workflow file.
#
# To activate it, one command and a push from a human (or from a build whose
# `EPIK_BUILD_GH_TOKEN` has Workflows: write):
#
#     git mv .github/workflows-pending/ci.yml .github/workflows/ci.yml
#
# The contents below are final and were verified by running each check locally
# on the tree this landed on; nothing about the file needs editing.
# ---------------------------------------------------------------------------
#
# One job on an ubuntu runner, provisioned for the whole 0.2.0 shape rather than
# just the crates that exist today: Tauri's Linux system libraries, the
# `wasm32-unknown-unknown` target, and Trunk are installed up front so the job
# keeps working unchanged as the Tauri and Leptos crates arrive.
#
# `workflow_dispatch` is here for headless builds. A pull request opened with
# `github.token` does not trigger `pull_request` runs — that is GitHub's
# loop-prevention rule, and `workflow_dispatch` is its documented exception — so
# a headless builder dispatches this workflow against its branch to get real
# check results. Humans never need it.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Superseded runs on the same ref are pointless; let a new push cancel them.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Debug info is the bulk of the target dir and nothing here reads a backtrace
  # off a symbolized frame; dropping it makes the cache small enough to be worth
  # restoring.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  check:
    name: fmt · clippy · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # Tauri 2 links against the system WebKit stack; librsvg and the
      # appindicator library are needed by the bundler and tray respectively.
      # Installed before the Rust steps because `tauri-build` probes for them
      # via pkg-config at compile time, not at bundle time.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            file \
            patchelf

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal \
            --component rustfmt --component clippy
          rustup default stable
          rustup target add wasm32-unknown-unknown
          rustc --version && cargo --version
          cargo fmt --version && cargo clippy --version

      - name: Cache cargo registry and target directory
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Prebuilt binary first; `cargo install` is the fallback so a missing or
      # renamed release asset degrades to slow rather than broken.
      - name: Install Trunk
        run: |
          if command -v trunk >/dev/null 2>&1; then
            echo "trunk already present: $(trunk --version)"
            exit 0
          fi
          url=https://github.com/trunk-rs/trunk/releases/latest/download/trunk-x86_64-unknown-linux-gnu.tar.gz
          if curl -fsSL --retry 3 "$url" -o /tmp/trunk.tar.gz; then
            tar -xzf /tmp/trunk.tar.gz -C "$HOME/.cargo/bin" trunk
            chmod +x "$HOME/.cargo/bin/trunk"
          else
            echo "prebuilt Trunk unavailable — building from source"
            cargo install --locked trunk
          fi
          trunk --version

      # The Leptos frontend is a wasm crate, so it is checked on its own target
      # rather than by the workspace-wide steps below. Both steps are guarded on
      # the crate existing so this workflow is valid before it lands and after.
      - name: Build frontend (wasm)
        run: |
          if [ -f crates/epik-ui/Trunk.toml ]; then
            trunk build --config crates/epik-ui/Trunk.toml
          else
            echo "no frontend crate yet — skipping"
          fi

      - name: Clippy frontend (wasm)
        run: |
          if [ -f crates/epik-ui/Cargo.toml ]; then
            cargo clippy --manifest-path crates/epik-ui/Cargo.toml --all-targets \
              --target wasm32-unknown-unknown -- -D warnings
          else
            echo "no frontend crate yet — skipping"
          fi

      - name: Frontend tests
        run: |
          if [ -f crates/epik-ui/Cargo.toml ]; then
            # On the host target: the transcript reducer is pure and its tests
            # need no browser, so they run as ordinary unit tests.
            cargo test --manifest-path crates/epik-ui/Cargo.toml
          else
            echo "no frontend crate yet — skipping"
          fi

      # The frontend must not redeclare a type epik-core already defines. One
      # definition of an event is the whole point of sharing the crate across the
      # IPC boundary; a mirrored struct would compile happily and then drift.
      - name: Frontend defines no mirrored core types
        run: |
          if [ ! -d crates/epik-ui/src ]; then
            echo "no frontend crate yet — skipping"
            exit 0
          fi
          shared='SessionEvent|SessionConfig|CanUseToolRequest|PermissionDecision|PermissionRule|PermissionPolicy|PermissionAction|ToolMatcher|EngineReport|EngineStatus|EngineSearch|Profile|StreamMessage|ContentBlock|ResultMessage|SystemMessage|ControlRequest'
          if grep -rnE "^[[:space:]]*(pub )?(struct|enum) ($shared)\b" crates/epik-ui/src; then
            echo "::error::the frontend redeclares a type epik-core already defines"
            exit 1
          fi
          echo "no mirrored core types in the frontend"

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: cargo build
        run: cargo build --workspace
