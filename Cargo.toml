[workspace]
resolver = "3"
members = ["crates/epik-core", "crates/epik-app"]

# The Leptos frontend is a wasm crate. It is deliberately not a workspace member:
# `cargo build --workspace` would try to build it for the host target, which is
# not a target it is written for and not a build anyone wants. It is checked on
# its own target instead — `trunk build` plus a wasm-target clippy run, both in
# CI — which is stricter than being swept up by a host-target workspace command.
exclude = ["crates/epik-ui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/wpm/epik-app-spike"

# Shared so the crates that arrive later in 0.2.0 — the Tauri host and the
# Leptos frontend — cannot drift from the core on a version that crosses the
# IPC boundary. `serde` in particular has to be one version everywhere.
[workspace.dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
